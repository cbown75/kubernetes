apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator
  labels:
    # The operands mount host paths and run privileged on the GPU node.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    # Helm's uninstall hook Jobs run in this namespace; pruning it with the
    # HelmRelease would block them and strand cluster-scoped objects.
    kustomize.toolkit.fluxcd.io/prune: disabled
