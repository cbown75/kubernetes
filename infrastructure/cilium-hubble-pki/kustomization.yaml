apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pki.yaml
# Keep in sync with spec.secretTemplate.labels in pki.yaml; this transformer
# doesn't reach Secrets created by cert-manager.
labels:
  - pairs:
      app.kubernetes.io/name: cilium-hubble-pki
      app.kubernetes.io/part-of: infrastructure
