apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    name: metallb-system
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: metallb
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 24h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: metallb
spec:
  targetNamespace: metallb-system
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.2"
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    # TEMPORARY for the 0.14.8 -> 0.16.2 upgrade: a rollback restores the old
    # one-at-a-time speaker rollout and mixes speaker versions (see the speaker
    # updateStrategy below). Fail in place instead; restore retries: 3 after.
    remediation:
      retries: 0
  rollback:
    recreate: true
    force: true
  values:
    controller:
      enabled: true
      logLevel: warn
      resources:
        limits:
          cpu: 100m
          memory: 100Mi
        requests:
          cpu: 50m
          memory: 50Mi
      # Pod-level securityContext only. The chart hardcodes the container-level
      # hardening (drop ALL, read-only root, no privilege escalation).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    speaker:
      enabled: true
      # TEMPORARY for the 0.16.2 upgrade; restore the default once every
      # speaker runs v0.16.2. 0.16.2 changed memberlist key derivation
      # (metallb#3143), so old and new speakers cannot gossip. A one-at-a-time
      # rollout splits the L2 election and double-announces LB IPs; replace
      # every speaker at once.
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 100%
      logLevel: warn
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      # Pod-level only; the chart sets the container to drop ALL + add NET_RAW.
      securityContext:
        runAsUser: 0
            #    prometheus:
            #      namespace: monitoring
            #      serviceAccount: metallb-controller
            #      app.kubernetes.io/part-of: monitoring-stack
            #      serviceMonitor:
            #        enabled: true
            #        additionalLabels:
            #          app.kubernetes.io/part-of: monitoring-stack
            #      prometheusRule:
            #        enabled: true
            #        additionalLabels:
            #          app.kubernetes.io/part-of: monitoring-stack
    crds:
      enabled: true
      validationFailurePolicy: Fail
    frrk8s:
      enabled: false
