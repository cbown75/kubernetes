apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - kustomization-infrastructure.yaml
  - kustomization-apps.yaml
  - gitrepository-private.yaml
  - kustomization-media-storage.yaml
  - kustomization-media-apps.yaml
patches:
  # Flux v2.9 adds its CRDs to the `all` category; keep them out of `kubectl delete all`.
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.toolkit\\.fluxcd\\.io"
    patch: |-
      - op: test
        path: /spec/names/categories/0
        value: all
      - op: remove
        path: /spec/names/categories/0
