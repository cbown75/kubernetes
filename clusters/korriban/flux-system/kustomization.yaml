apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - kustomization-infrastructure.yaml
  - kustomization-apps.yaml
  - gitrepository-private.yaml
  - kustomization-media-storage.yaml
  - kustomization-media-apps.yaml
patches:
  # Flux v2.9 adds its CRDs to the `all` category; keep them out of `kubectl delete all`.
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.source\\.toolkit\\.fluxcd\\.io"
    patch: |-
      - op: add
        path: /spec/names/categories
        value: [fluxcd, fluxcd-sources]
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.(kustomize|helm)\\.toolkit\\.fluxcd\\.io"
    patch: |-
      - op: add
        path: /spec/names/categories
        value: [fluxcd, fluxcd-appliers]
  - target:
      kind: CustomResourceDefinition
      name: ".*\\.notification\\.toolkit\\.fluxcd\\.io"
    patch: |-
      - op: add
        path: /spec/names/categories
        value: [fluxcd, fluxcd-notifications]
