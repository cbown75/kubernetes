apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/korriban/infrastructure
  prune: true
  wait: true
  # Longer than the cilium HelmRelease's 15m timeout.
  timeout: 20m
