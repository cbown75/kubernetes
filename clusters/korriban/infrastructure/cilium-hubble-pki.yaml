apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-hubble-pki
  namespace: flux-system
spec:
  # Not dependsOn infrastructure: once the cilium HelmRelease consumes these
  # Secrets (BOW-857), it waits on hubble-relay, which waits on them. The
  # cilium-system namespace comes from infrastructure; until it exists,
  # applies fail and retry.
  dependsOn:
    - name: cert-manager-base
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cilium-hubble-pki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
