apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-hubble-pki
  namespace: flux-system
  labels:
    app.kubernetes.io/name: cilium-hubble-pki
    app.kubernetes.io/part-of: infrastructure
spec:
  # Not dependsOn infrastructure: cilium HelmRelease installs and upgrades
  # wait on hubble-relay, which waits on these Secrets. The cilium-system
  # namespace comes from infrastructure; until it exists, applies fail and
  # retry.
  dependsOn:
    - name: cert-manager-base
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cilium-hubble-pki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
