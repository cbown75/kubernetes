apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
  labels:
    app.kubernetes.io/name: nvidia-runtimeclass
    app.kubernetes.io/part-of: gpu-infrastructure
  annotations:
    # Kept through the device-plugin removal so immich pods wait as Pending
    # instead of being rejected; gpu-operator adopts it when it is dropped from Git.
    kustomize.toolkit.fluxcd.io/prune: disabled
handler: nvidia
