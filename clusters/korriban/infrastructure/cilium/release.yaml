apiVersion: v1
kind: Namespace
metadata:
  name: cilium-system
  labels:
    name: cilium-system
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: infrastructure
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/part-of: infrastructure
spec:
  interval: 10m
  timeout: 15m
  targetNamespace: cilium-system
  chart:
    spec:
      chart: cilium
      version: "1.18.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    replace: true
    crds: CreateReplace
    # Retry a failed install instead of remediating: install remediation
    # always uninstalls, which would remove the CNI. On bootstrap or DR,
    # hubble-relay can't become ready until cert-manager, which needs this CNI,
    # issues the Hubble Secrets, so the first install can time out; a failed
    # install that reached Helm storage is retried as an upgrade, which waits
    # again. While this strategy is set, remediation below never uninstalls,
    # but its retries still cap an absent or out-of-sync release; keep it.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
  upgrade:
    # Off while upgrade.strategy is RetryOnFailure: with no rollback, Helm
    # would delete the resources a failed upgrade created while the updated
    # workloads still reference them. Restore it with BOW-861.
    cleanupOnFail: false
    crds: CreateReplace
    # Retry a failed upgrade instead of rolling back: rollback targets
    # predate the switch to cert-manager Hubble Secrets. While this strategy
    # is set, remediation below never rolls back, but its retries still cap
    # an absent or out-of-sync release; keep it. Remove this strategy once a
    # release after the switch is deployed and no rollback target predates
    # it (BOW-861).
    # Change this only in Git: an in-cluster edit that removes or renames this
    # strategy re-enables rollback until Flux re-applies it.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    remediation:
      retries: 3
      remediateLastFailure: true
  # Unused while upgrade.strategy is RetryOnFailure.
  rollback:
    cleanupOnFail: true
    timeout: 10m
  values:
    rbac:
      create: true
    serviceAccounts:
      cilium:
        create: true
        name: cilium
        automount: true
      operator:
        create: true
        name: cilium-operator
        automount: true
      hubbleRelay:
        create: true
        name: hubble-relay
        automount: true
      ui:
        create: true
        name: hubble-ui
        automount: true
    securityContext:
      privileged: true
    cluster:
      # Must match the hubble-server-tls SAN in
      # infrastructure/cilium-hubble-pki/pki.yaml (*.korriban.hubble-grpc.cilium.io).
      name: korriban
      id: 1
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.245.0.0/16"]
        clusterPoolIPv4MaskSize: 20
    devices: "eth+ ens+ enp+ eno+ bond+"
    autoDirectNodeRoutes: false
    routingMode: tunnel
    tunnelProtocol: geneve
    tunnelPort: 6081
    kubeProxyReplacement: true
    k8sServiceHost: "10.10.7.10"
    k8sServicePort: 6443
    cni:
      chainingMode: none
      exclusive: false
      uninstall: false
      confPath: "/etc/cni/net.d"
      binPath: "/opt/cni/bin"
    envoy:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    hubble:
      enabled: true
      tls:
        # Certs come from cert-manager via the cilium-hubble-pki Kustomization
        # (infrastructure/cilium-hubble-pki). The chart's helm method never
        # renews them. Until the Secrets exist, each agent's Hubble server
        # fails closed; hubble-relay stays in ContainerCreating without
        # hubble-relay-client-tls and can't become ready without the agents'
        # hubble-server-tls.
        auto:
          enabled: false
        server:
          existingSecret: hubble-server-tls
      relay:
        enabled: true
        replicas: 2
        tls:
          client:
            existingSecret: hubble-relay-client-tls
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      ui:
        enabled: true
        backend:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        frontend:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - httpV2
          - "policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity"
    operator:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      prometheus:
        enabled: true
        port: 9963
        serviceMonitor:
          enabled: false
    prometheus:
      enabled: true
      port: 9962
      serviceMonitor:
        enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true
