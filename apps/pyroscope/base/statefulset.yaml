apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pyroscope
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/part-of: monitoring-stack
spec:
  serviceName: pyroscope
  replicas: 1
  selector:
    matchLabels:
      app: pyroscope
  template:
    metadata:
      labels:
        app: pyroscope
        app.kubernetes.io/name: pyroscope
    spec:
      serviceAccountName: pyroscope
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: pyroscope
          image: grafana/pyroscope:2.0.3
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/pyroscope/config.yaml
            - -target=all
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          volumeMounts:
            - name: pyroscope-config
              mountPath: /etc/pyroscope
            - name: storage
              mountPath: /data
          env:
            - name: PYROSCOPE_LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          # v2 (-target=all) startup is slow: the metastore wins a raft election and
          # the segment-writer joins its ring and serves /ready for 30s before the pod
          # is ready — the old 45s liveness delay SIGTERM'd it mid-startup into a crash
          # loop (BOW-570). startupProbe gates readiness/liveness until the first /ready
          # (~300s, ~2x the observed cold start, under PodNotReadyProlonged's 15m so a
          # genuinely wedged pod still alerts). liveness is a TCP check on the http port
          # (process up), NOT /ready — /ready reflects raft election + ring membership,
          # so a post-startup election or ring flap must not restart a live pod;
          # readiness (/ready) pulls it from Service endpoints instead.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: pyroscope-config
          configMap:
            name: pyroscope-config
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
