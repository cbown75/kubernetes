apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: immich
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich
spec:
  replicas: 1
  # Recreate: redis-pvc is ReadWriteOnce, so the old pod must release the
  # volume before the new one can attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # `command:` bypasses the entrypoint's root -> redis drop, so set the uid here.
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # AOF persists the BullMQ queue; nothing re-queues jobs if it's lost.
          # umask 0077 because `command:` bypasses the entrypoint that sets it.
          # --save '' keeps RDB off: save points enable stop-writes-on-bgsave-error,
          # which freezes all writes after one failed BGSAVE.
          # maxmemory 256mb = half the 512Mi limit, leaving room for the AOF-rewrite
          # fork; noeviction rejects writes rather than silently dropping queued jobs.
          command:
            - /bin/sh
            - -c
            - >-
              umask 0077;
              exec redis-server
              --appendonly yes
              --appendfsync everysec
              --save ''
              --maxmemory 256mb
              --maxmemory-policy noeviction
              --dir /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # -e makes redis-cli exit non-zero on the -LOADING error during AOF
          # replay; without it these probes pass instantly and gate nothing.
          startupProbe:
            exec:
              command: ["redis-cli", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["redis-cli", "-e", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "-e", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
