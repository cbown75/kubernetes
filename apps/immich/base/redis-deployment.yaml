apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: immich
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: immich
spec:
  replicas: 1
  # Recreate: redis-pvc is ReadWriteOnce, so the old pod must release the
  # volume before the new one can attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # Run as the redis uid explicitly. `command:` below bypasses the image
      # entrypoint (which would normally drop root -> redis), so without this the
      # network-facing redis process would run as root. The export squashes to
      # 1024:users with mode 0777, so uid 999 writes fine — same as harbor/valkey.
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # AOF persistence: the BullMQ job queue (immich_bull:*) lives only in
          # redis. Without this, a restart silently drops every queued job while
          # Postgres still marks the assets incomplete, and nothing re-queues them.
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Redis answers PING with a -LOADING error until the AOF is fully
          # replayed, so a bare liveness probe would kill it mid-recovery and
          # crash-loop forever once the AOF outgrows ~50s of load time. The
          # startupProbe gates liveness/readiness until recovery completes,
          # allowing up to 10 minutes.
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
