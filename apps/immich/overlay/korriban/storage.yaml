# Static PV for Immich uploads (read-write)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-photos-pv
spec:
  capacity:
    storage: 5Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: holocron.home.cwbtech.net
    path: /volume1/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-photos-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-photos-pv
  resources:
    requests:
      storage: 5Ti
---
# Static PV for external library (read-write for sidecar files)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-external-pv
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: holocron.home.cwbtech.net
    path: /volume1/pictures
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-external-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: immich-external-pv
  resources:
    requests:
      storage: 10Ti
---
# Redis AOF persistence for the immich BullMQ job queue.
# Matches the n8n/redis and harbor/valkey convention (nfs-holocron-fast, 2Gi, RWO).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: immich
  # Overlay-only resources don't inherit base/kustomization.yaml commonLabels,
  # so set them explicitly.
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: photo-management
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-holocron-fast
  resources:
    requests:
      storage: 2Gi
