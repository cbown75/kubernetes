apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-dashboard-provisioner
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring-stack
# Dashboards live only in monitoring; cluster-wide ConfigMap read exposed
# credentials other charts put in ConfigMaps (e.g. harbor/harbor-registry).
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
