apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-valkey
  namespace: harbor
  labels:
    app.kubernetes.io/name: harbor-valkey
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # Redis/Valkey holds Harbor's jobservice queue; a single writer, recreate on update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harbor-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harbor-valkey
        app.kubernetes.io/component: redis
      annotations:
        # In-cluster datastore — kept out of the mesh (matches the repo's convention
        # for in-pod postgres/redis). Harbor reaches it over PERMISSIVE mTLS.
        sidecar.istio.io/inject: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:8.1-alpine
          imagePullPolicy: IfNotPresent
          # appendonly for durability of the job queue; noeviction so queued jobs are
          # never dropped under memory pressure.
          args:
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - noeviction
          ports:
            - name: valkey
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: harbor-valkey
